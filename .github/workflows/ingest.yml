# Reading the feeds, in the cloud.
#
# WHY THIS EXISTS, AND WHY IT IS SEPARATE FROM `morning`.
# Until 2026-11-02 one Windows laptop read the feeds every hour and the cloud did not read them at
# all. `morning` grew a staleness-gated ingest as a BACKSTOP for the day the lid was shut, but a
# backstop that only ever runs when something is already broken is a backstop nobody has tested --
# and worse, it left the corpus depending on a machine that sleeps. The site kept publishing on
# time from a corpus that had quietly stopped moving, and the live-site check could not see it,
# because every page was present and correct.
#
# This workflow makes the cloud the PRIMARY reader. It is deliberately not a step inside `morning`:
#
#   - `morning` has a deadline. Ingest takes ~21 minutes (measured, run 41431514517) and must never
#     sit between a delayed cron and 08:00 Oslo.
#   - `morning` deploys. This does not touch the site, so it can fail without any publishing risk.
#   - This needs no Node, no wrangler and no Cloudflare credentials. Fewer secrets, faster start.
#
# TIMING. Hourly, and the Actions minute matters: cron delay on this repo has been measured at six
# to seven hours (2026-10-08) and ~three hours (2026-10-28), and GitHub's own guidance is that
# on-the-hour slots are the most contended. So :40 rather than :00, and twenty-four slots a day
# rather than a few -- whichever slot actually fires and finds a stale corpus does the work, and a
# slot arriving late or not at all costs nothing because the next one is an hour behind it. This is
# the same reasoning as `morning`'s spread of slots, applied to a job that has no deadline at all.
#
# COST. The repo is public, so standard runners are unmetered -- an hourly schedule is free in
# runner time. It is NOT free in model tokens: ingest_pass() ends with the Gemini translate passes,
# so a run with a translation backlog spends real money there. Embedding is local (bge-m3 in the
# container below) and spends nothing.
#
# A run that finds the corpus fresh exits in about ten seconds having installed nothing.
name: ingest

on:
  schedule:
    - cron: "40 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Ingest even if the corpus is fresh"
        type: boolean
        default: false

# Queue, never cancel, and never overlap. Two passes at once would both pull the same 64
# unembedded rows in score() and embed them twice -- not corrupting anything (items upsert with
# ignore_duplicates and the vectors would be identical), just paying twice. A queued run reaches
# the gate after the one ahead of it has finished, finds the corpus fresh, and exits.
concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    # The measured pass is ~21 minutes against a fresh corpus. The passes that matter are the ones
    # after an outage, with a backlog -- SCORE_BATCHES bounds the embedding but fetch() still has
    # 120 sources to poll and enrich. Headroom, not optimism.
    timeout-minutes: 50
    env:
      PYTHONPATH: .
      PYTHONIOENCODING: utf-8
      PYTHONUNBUFFERED: "1"
      # The 22,937-file item archive is derived, is not in this repo, and nothing downstream of an
      # ingest reads it. Writing it here would cost minutes and keep nothing.
      ARCHIVE_WRITES: "0"
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      # Hourly slots against a two-hour gate: on a normal day roughly every other run works and
      # the rest exit at the gate. Deliberately shorter than `morning`'s 6h backstop threshold, so
      # that this workflow -- not the publish -- is what normally keeps the corpus moving.
      INGEST_IF_OLDER_THAN_H: "2"
      # Up from the default 12 (= 768 items). Embedding runs against a local model on the runner
      # with no per-minute quota, so the only real bound is the job timeout above, and a pass after
      # an outage has more to catch up on than an hourly one does.
      SCORE_BATCHES: "24"
      # Pinned, and from the vendor's own image rather than piping their install script into a
      # shell. 0.40.13 was the newest non-rc tag on 2026-11-02; the laptop runs 0.40.6.
      OLLAMA_IMAGE: "ollama/ollama:0.40.13"
      # bge-m3 as the laptop has it: 1024-d, F16, 1.16 GB. ASSERTED, not assumed -- `bge-m3` is a
      # moving tag, and a re-quantised build would still embed, still return 1024 numbers, and
      # still score against the vectors already in the table while no longer being comparable with
      # them. That failure is invisible: hit rates drift and nothing errors. The digest is the only
      # thing that makes "the same embedder" checkable, so a mismatch stops the run and leaves the
      # corpus alone.
      BGE_M3_DIGEST: "7907646426070047a77226ac3e684fbbe8410524f7b4a74d02837e43f2146bab"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Secrets are pasted by hand, and a paste that picks up a trailing newline does not fail like
      # a wrong secret. It fails like a broken network: an illegal HTTP header value, which the
      # OpenAI SDK reports as `APIConnectionError: Connection error.` and wrangler reported as
      # "Invalid format for Authorization header". A wrong-but-clean secret returns a clean 401, so
      # whitespace is the failure mode with the most misleading error message. Ten seconds here
      # beats twenty minutes and a confusing traceback. Nothing is printed but name and verdict.
      #
      # Only two secrets matter to this workflow, and they fail differently: without Supabase there
      # is nothing to read or write, so stop. Without Gemini, fetch() and the embedding still work
      # and only the translate passes at the end of ingest_pass() fail -- worth a red run, not
      # worth skipping the ingest.
      - name: Check the secrets are not whitespace-tainted
        id: secrets
        run: |
          set -uo pipefail
          fatal=0; warned=0
          check() {
            name="$1"; val="$2"; needed="$3"
            if [ -z "$val" ]; then verdict="MISSING";
            elif [ "${#val}" -ne "$(printf %s "$val" | tr -d '[:space:]' | wc -c)" ]; then
              verdict="HAS WHITESPACE -- re-paste it with no trailing newline"
            else
              echo "  $name: ok (${#val} chars)"; return
            fi
            if [ "$needed" = yes ]; then
              echo "::error::$name: $verdict"; fatal=1
            else
              echo "::warning::$name: $verdict -- translation will fail, fetch and embedding will not"
              warned=1
            fi
          }
          check SUPABASE_URL              "${SUPABASE_URL:-}"              yes
          check SUPABASE_SERVICE_ROLE_KEY "${SUPABASE_SERVICE_ROLE_KEY:-}" yes
          check GEMINI_API_KEY            "${GEMINI_API_KEY:-}"            no
          echo "tainted=$warned" >> "$GITHUB_OUTPUT"
          [ "$fatal" = 0 ] || { echo "::error::Supabase is unreachable with these credentials; not ingesting."; exit 1; }

      # Ask before paying. One indexed row answers "have the feeds been read lately?", and it does
      # not care WHICH machine read them -- so the laptop's remaining passes and this satisfy it
      # equally, and the two can coexist without doing the work twice.
      - name: Is the corpus stale?
        id: corpus
        run: |
          set -uo pipefail
          pip install -r requirements.txt
          age=$(python run.py --corpus-age 2>/dev/null | tail -1)
          echo "newest item fetched ${age}h ago; threshold ${INGEST_IF_OLDER_THAN_H}h"
          echo "age=$age" >> "$GITHUB_OUTPUT"
          if [ "${{ inputs.force }}" = "true" ]; then
            echo "stale=1" >> "$GITHUB_OUTPUT"
            echo "forced by workflow_dispatch -- ingesting regardless of age"
          elif python -c "import sys; sys.exit(0 if float(sys.argv[1]) > float(sys.argv[2]) else 1)" \
               "$age" "$INGEST_IF_OLDER_THAN_H"; then
            echo "stale=1" >> "$GITHUB_OUTPUT"; echo "ingesting"
          else
            echo "stale=0" >> "$GITHUB_OUTPUT"; echo "corpus is fresh -- nothing to do"
          fi

      - name: Cache the embedding model
        if: ${{ steps.corpus.outputs.stale == '1' }}
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ollama
          key: ollama-bge-m3-${{ env.BGE_M3_DIGEST }}

      - name: Start Ollama and verify the embedding model
        id: ollama
        if: ${{ steps.corpus.outputs.stale == '1' }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ollama"
          docker run -d --name ollama -p 11434:11434 \
            -v "$RUNNER_TEMP/ollama:/root/.ollama" "$OLLAMA_IMAGE"
          for _ in $(seq 1 45); do
            curl -sf http://localhost:11434/api/version >/dev/null && break || sleep 2
          done
          curl -sf http://localhost:11434/api/version
          docker exec ollama ollama pull bge-m3
          got=$(curl -sf http://localhost:11434/api/tags \
            | python -c "import json,sys; print(next(m['digest'] for m in json.load(sys.stdin)['models'] if m['name'].startswith('bge-m3')))")
          echo "bge-m3 digest: $got"
          if [ "$got" != "$BGE_M3_DIGEST" ]; then
            echo "::error::bge-m3 digest does not match the laptop's ($BGE_M3_DIGEST)."
            echo "::error::Embedding with a different build would produce vectors that are not comparable with the ones already stored. Not ingesting."
            exit 1
          fi
          # The container runs as root and the volume mount is a host directory, so everything it
          # writes here is root-owned -- including `id_ed25519` at mode 600. The cache post-step
          # runs as `runner` and tars the path, so without this it fails with "Cannot open:
          # Permission denied" and saves nothing. MEASURED: the cache step looked fine in both
          # workflows from the day it was added and never stored a byte; the only evidence was a
          # `##[warning]Failed to save` at the very bottom of post-job cleanup, under a deprecation
          # notice. A caching step that silently does nothing is worse than no caching step.
          sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/ollama"

      - name: Ingest
        id: ingest
        if: ${{ steps.corpus.outputs.stale == '1' }}
        env:
          EMBEDDER: ollama
          EMBED_MODEL: bge-m3
          OLLAMA_URL: http://localhost:11434
          EMBED_RPM: "0"          # a local model has no per-minute quota to pace against
        run: |
          set -o pipefail
          python run.py --ingest 2>&1 | tee "$RUNNER_TEMP/ingest.log"

      - name: Report
        if: always()
        run: |
          {
            echo "corpus age at start: ${{ steps.corpus.outputs.age }}h (threshold ${INGEST_IF_OLDER_THAN_H}h)"
            echo "ingest: ${{ steps.ingest.outcome }}"
            if [ -f "$RUNNER_TEMP/ingest.log" ]; then
              grep -E '^(fetched|  [a-z-]+: )' "$RUNNER_TEMP/ingest.log" | sed 's/^/    /'
            fi
            if [ "${{ steps.secrets.outputs.tainted }}" = "1" ]; then
              echo "GEMINI_API_KEY is missing or has stray whitespace -- re-paste the secret."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # The corpus going stale is invisible from the site: every page stays present and correct
      # while the material behind it stops moving. A red run here is the only notification there is.
      - name: Fail the run if the ingest failed or a key is tainted
        if: ${{ always() && (steps.ingest.outcome == 'failure' || steps.ollama.outcome == 'failure' || steps.secrets.outputs.tainted == '1') }}
        run: |
          echo "::error::The feeds were not read, or were read without translation. The corpus is older than it should be."
          exit 1
