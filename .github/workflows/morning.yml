# The morning publish, off the laptop.
#
# WHY THIS EXISTS
# Until 2026-10-04 this ran on one Windows laptop via Task Scheduler. On 3 October the machine was
# asleep at the scheduled time, Windows caught up at 11:38 Oslo, and the brief for that day was
# never written. Wake timers help; a closed lid does not care about wake timers.
#
# TIMING. Actions cron is UTC and ignores DST; Oslo is UTC+2 (CEST) until 25 October and UTC+1
# after, so the deadline of 08:00 Oslo is 06:00 UTC in the tighter half of the year. Actions cron
# also runs late under load -- ten to thirty minutes routinely, and it occasionally skips a slot
# outright. Hence three attempts with hours of margin rather than one on the hour:
#
# MEASURED 2026-10-08: the three scheduled runs that day were created at 10:16, 11:08 and 11:45
# UTC. They were scheduled for 03:00, 04:00 and 05:00. That is a delay of six and a half to seven
# and a quarter hours, not the ten to thirty minutes the docs lead you to expect, and all three
# landed after the 08:00 Oslo deadline. They succeeded; they were simply far too late to matter.
# The deadline that morning was met by the laptop, not by this.
#
# So the slots now start the previous EVENING and span eight hours, on the reasoning that a cron
# delayed by N hours still has to fire eventually and one of these should land in the window:
#
#     22:00 UTC (prev day) -> 23:00 Oslo on time, ~06:00 Oslo at the delay seen on 8 Oct
#     00:00 UTC            -> 01:00 Oslo on time
#     02:00 UTC            -> 03:00 Oslo on time
#     03:30 UTC            -> 04:30 Oslo on time
#     04:00 UTC            -> 05:00 Oslo on time   <- the drafting floor exactly
#     05:00 UTC            -> 06:00 Oslo on time
#     06:00 UTC            -> 07:00 Oslo on time   <- last on-time chance before the deadline
#
# An early slot costs nothing when it runs ON time: run.py refuses to draft before Oslo 05:00 and
# the run simply redeploys. That is what makes this safe to spread -- run.py, not the cron, decides
# when a brief is written. Drafting is idempotent per Oslo day, so whichever slot gets there first
# writes the morning and the rest skip and redeploy.
#
# MEASURED 2026-10-28, and the reason the last three slots exist. Every run that day was green and
# not one of them drafted anything. The slots fired at 00:49, 04:16, 07:52, 09:54 and 10:56 UTC:
# the first two arrived before any desk was due under the old hour-gate, and the last three arrived
# after 08:00 Oslo. The paper was written at 06:01-06:41 Oslo by the laptop -- the single machine
# this workflow was built to stop depending on -- and the cloud runs found the work already done.
# Two things came out of that: these later slots, so an ON-TIME firing lands inside the drafting
# window, and the floor in run.py's due_products(), so a run arriving EARLY drafts the morning
# instead of finding nothing due. Neither alone is enough; cron punctuality cannot be relied on in
# either direction.
name: morning

on:
  schedule:
    - cron: "0 22 * * *"
    - cron: "0 0 * * *"
    - cron: "0 2 * * *"
    - cron: "30 3 * * *"
    - cron: "0 4 * * *"
    - cron: "0 5 * * *"
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      skip_draft:
        description: "Publish only, do not draft"
        type: boolean
        default: false

# Never let two attempts overlap: both would deploy, and the loser could publish an older build
# over a newer one. Queue instead of cancel -- a run that is already deploying should finish.
concurrency:
  group: morning
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: .
      PYTHONIOENCODING: utf-8
      PYTHONUNBUFFERED: "1"
      SITE_TOOLCHAIN: ${{ github.workspace }}/.toolchain
      # The 22,937-file item archive is derived and is not in this repo. Nothing in the publish
      # path reads it -- the site build reads the four JSON exports, regenerated from the database
      # on every run -- so writing it here would cost minutes and keep nothing.
      ARCHIVE_WRITES: "0"
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # Wrangler works out the account by listing accounts, and a Pages-scoped token sees none --
      # it returns success with an empty list, so the error is "Failed to automatically retrieve
      # account IDs" rather than a permission denial. Locally this never came up because wrangler
      # has an interactive OAuth login that already knows the account. A repository VARIABLE, not
      # a secret: an account id is an identifier that appears in dashboard URLs, not a credential,
      # and writing it down where it can be read makes this failure obvious next time.
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Secrets are pasted by hand, and a paste that picks up a trailing newline does not fail
      # like a wrong secret. It fails like a broken network: an illegal HTTP header value, which
      # the OpenAI SDK reports as `APIConnectionError: Connection error.` and wrangler reported as
      # "Invalid format for Authorization header". Both cost this project days -- editor-letter was
      # off the site from 10 to 28 October on exactly this. A wrong-but-clean secret returns a
      # clean 401, so whitespace is the failure mode with the most misleading error message.
      #
      # Checked here, by length, so it is caught in ten seconds rather than after the draft step
      # has burned a model call. Nothing is printed but the name and the verdict.
      - name: Check the secrets are not whitespace-tainted
        run: |
          set -uo pipefail
          bad=0
          check() {
            local name="$1" val="$2"
            if [ -z "$val" ]; then echo "  $name: MISSING"; bad=1; return; fi
            if [ "${#val}" -ne "$(printf %s "$val" | tr -d '[:space:]' | wc -c)" ]; then
              echo "  $name: contains whitespace -- re-paste it with no trailing newline"; bad=1
            else
              echo "  $name: ok (${#val} chars)"
            fi
          }
          check SUPABASE_URL "${SUPABASE_URL:-}"
          check SUPABASE_SERVICE_ROLE_KEY "${SUPABASE_SERVICE_ROLE_KEY:-}"
          check GEMINI_API_KEY "${GEMINI_API_KEY:-}"
          check OPENAI_API_KEY "${OPENAI_API_KEY:-}"
          check CLOUDFLARE_API_TOKEN "${CLOUDFLARE_API_TOKEN:-}"
          check CLOUDFLARE_ACCOUNT_ID "${CLOUDFLARE_ACCOUNT_ID:-}"
          [ "$bad" = 0 ] || { echo "::error::A credential is missing or has stray whitespace; see above."; exit 1; }

      - name: Install toolchain
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # `npm install --prefix X` reads package.json from INSIDE X, not from the repo root,
          # so this copies the manifest in first. The toolchain is kept out of the repo on purpose
          # -- see core/publish.py's header -- and the runner mirrors that rather than installing
          # node_modules next to the source.
          mkdir -p "$SITE_TOOLCHAIN"
          cp package.json "$SITE_TOOLCHAIN/package.json"
          npm install --prefix "$SITE_TOOLCHAIN" --no-audit --no-fund
          test -x "$SITE_TOOLCHAIN/node_modules/.bin/eleventy" || { echo "eleventy missing"; exit 1; }
          test -x "$SITE_TOOLCHAIN/node_modules/.bin/wrangler" || { echo "wrangler missing"; exit 1; }

      # Drafting is allowed to fail WITHOUT taking the publish down with it. That is the whole
      # lesson of publish_local.cmd: drafting dies whenever the Gemini credits run dry, and a page
      # frozen at yesterday with nothing saying so is worse than a page that refreshes and shows
      # its own build stamp. The deploy below therefore runs with `if: always()`.
      # THE LIST LIVES IN THE PRODUCT CONFIGS, NOT HERE.
      #
      # This step drafted `daily-digest` alone while four other desks existed only as scheduled
      # tasks on one laptop. That laptop was off from 23 to 26 October and the site published one
      # brief a day instead of five, with every cloud run reporting success, because the one desk
      # the workflow knew about worked fine. Replacing one hard-coded list with a longer one would
      # have failed again the next time a desk was added.
      #
      # `--run-due` reads config/<newsroom>/products/*.json, takes everything with
      # trigger=schedule, and drafts whatever the Oslo clock says is due by that product's OWN
      # cron. Adding a desk is adding a config file; nothing here changes. One desk failing does
      # not stop the others, and drafting stays idempotent per Oslo day, so the later cron slots
      # find each edition already written and spend nothing.
      - name: Draft everything due
        id: draft
        if: ${{ !inputs.skip_draft }}
        continue-on-error: true
        run: |
          set -o pipefail
          python run.py --run-due --newsroom nord-norge 2>&1 | tee "$RUNNER_TEMP/draft.log"

      - name: Build and deploy
        if: always()
        run: python run.py --deploy

      # Without this the workflow is green whenever the commands exit 0, which is not the same as
      # the site being correct. Checks the live origin, not the build directory.
      - name: Verify the live site
        if: always()
        run: |
          set -euo pipefail
          B=https://norway-royal-news.pages.dev
          code=$(curl -sS -o /tmp/live.html -w '%{http_code}' "$B/?ci=${GITHUB_RUN_ID}")
          echo "front page: HTTP $code"
          test "$code" = "200"
          grep -q "Royal News of Norway" /tmp/live.html
          # The literature section has silently vanished before, when the build could not find
          # norlit's outbox. Assert it is there rather than hoping.
          curl -sS "$B/norlit/" | grep -c "norlit-2026" | awk '{ if ($1 < 1) { print "norlit empty"; exit 1 } print "norlit links: " $1 }'
          # The archive must never be reachable on the public origin.
          for p in everything browse item source categories; do
            c=$(curl -sS -o /dev/null -w '%{http_code}' "$B/$p/")
            echo "/$p/ -> $c"; test "$c" = "404"
          done
          echo "build stamp: $(grep -oE 'Page built [0-9-]+ [0-9:]+' /tmp/live.html | head -1)"

      - name: Report the draft outcome
        if: always()
        run: |
          echo "draft step: ${{ steps.draft.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          if [ -f "$RUNNER_TEMP/draft.log" ]; then
            grep -E '^(due:|FAILED:|skip:|  [a-z-]+ +scheduled)' "$RUNNER_TEMP/draft.log"               | sed 's/^/    /' >> "$GITHUB_STEP_SUMMARY" || true
          fi
          if [ "${{ steps.draft.outcome }}" = "failure" ]; then
            echo "The site was still rebuilt and deployed; it carries its own build stamp and a stale banner if today's brief is missing." >> "$GITHUB_STEP_SUMMARY"
          fi

      # THE RUN MUST GO RED WHEN A DESK DIES.
      #
      # `continue-on-error` on the draft step is right -- a failed draft must not stop the deploy,
      # because a page frozen at yesterday with nothing saying so is worse than one that refreshes
      # and shows its own build stamp. But it also made the whole run GREEN, and that is how
      # editor-letter stayed broken from 10 to 28 October: eighteen days of successful-looking runs,
      # each one printing `failed: 1 -> editor-letter` into a log nobody opens. The step summary
      # said `draft step: failure` and nothing read it either.
      #
      # So: deploy first, verify, publish the summary -- then fail. The site is already updated by
      # the time this runs, so going red costs nothing but the notification it should have been
      # sending all along.
      - name: Fail the run if any desk failed to draft
        if: ${{ always() && steps.draft.outcome == 'failure' }}
        run: |
          echo "::error::A scheduled desk failed to draft. The site was deployed anyway; see the draft step."
          grep -E '^(FAILED:|due:)' "$RUNNER_TEMP/draft.log" || true
          exit 1
